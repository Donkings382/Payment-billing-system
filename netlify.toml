# Netlify configuration for Payment and Billing System
# This file configures the build and deployment settings for the frontend

[build]
  # Directory containing the React app source code
  base = "frontend"
  # Command to build the project
  publish = "build"
  command = "npm run build"

# Environment variables (set these in Netlify UI for security)
# REACT_APP_API_URL - Your backend API URL
# REACT_APP_SUPABASE_URL - Your Supabase project URL
# REACT_APP_SUPABASE_ANON_KEY - Your Supabase anonymous key

# Redirect rules for Single Page Application (SPA)
# This ensures React Router can handle client-side routing on page refresh
[[redirects]]
  from = "/api/*"
  to = "https://payment-billing-system-l9bs.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"